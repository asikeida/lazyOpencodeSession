name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Build
        run: go build -o "$RUNNER_TEMP/lazyocs" ./cmd/lazyocs
      - name: Cross-build release targets
        run: |
          GOOS=linux GOARCH=arm64 go build -o "$RUNNER_TEMP/lazyocs-linux-arm64" ./cmd/lazyocs
          GOOS=darwin GOARCH=amd64 go build -o "$RUNNER_TEMP/lazyocs-darwin-amd64" ./cmd/lazyocs
          GOOS=darwin GOARCH=arm64 go build -o "$RUNNER_TEMP/lazyocs-darwin-arm64" ./cmd/lazyocs
          GOOS=windows GOARCH=amd64 go build -o "$RUNNER_TEMP/lazyocs-windows-amd64.exe" ./cmd/lazyocs
          GOOS=windows GOARCH=arm64 go build -o "$RUNNER_TEMP/lazyocs-windows-arm64.exe" ./cmd/lazyocs
